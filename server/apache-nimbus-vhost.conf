# To include in the nimbus.rdem-systems.com HTTPS vhost on web-01 (NOT in .htaccess:
# Alias is not allowed there). The repository lives OUTSIDE the document root, because the
# site deployment (update.sh) runs rsync --delete on the document root.
#
# /unofficial-pbs-client/ itself is the landing page, prerendered by the site like any
# other page. Only the machine-readable paths below are aliased.

Alias /unofficial-pbs-client/rpm/        /srv/unofficial-pbs-client/current/rpm/
Alias /unofficial-pbs-client/arch/       /srv/unofficial-pbs-client/current/arch/
Alias /unofficial-pbs-client/alpine/     /srv/unofficial-pbs-client/current/alpine/
Alias /unofficial-pbs-client/deb/        /srv/unofficial-pbs-client/current/deb/
Alias /unofficial-pbs-client/keys/       /srv/unofficial-pbs-client/current/keys/
Alias /unofficial-pbs-client/source/     /srv/unofficial-pbs-client/current/source/
Alias /unofficial-pbs-client/index.json  /srv/unofficial-pbs-client/current/index.json

<Directory /srv/unofficial-pbs-client>
    Options +Indexes +FollowSymLinks -ExecCGI
    IndexOptions FancyIndexing NameWidth=* SuppressDescription
    AllowOverride None
    Require all granted

    # Package trees are for package managers, not for search results.
    Header set X-Robots-Tag "noindex"

    # Metadata must never be served stale; package files never change once published.
    <FilesMatch "(repomd\.xml(\.asc)?|\.db(\.sig)?|\.files(\.sig)?|\.tar\.gz\.sig|APKINDEX\.tar\.gz|InRelease|Release(\.gpg)?|Packages(\.gz)?|index\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "(\.rpm|\.apk|\.deb|\.zip|\.pkg\.tar\.zst|\.pkg\.tar\.zst\.sig)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>

AddType application/x-rpm .rpm
AddType application/vnd.debian.binary-package .deb
AddType application/pgp-keys .asc
AddType application/json .json
